<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#111418" />
<title>Exhibit G Time Logger</title>
<style>
  :root {
    --bg: #111418;
    --card: #1c2128;
    --card-edge: #2a313a;
    --text: #f5f7fa;
    --muted: #8b97a7;
    --accent-g: #f2b400;
    --accent-lunch: #4c9aff;
    --accent-wrap: #ff5b6e;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding: calc(var(--safe-top) + 14px) 16px calc(var(--safe-bottom) + 14px);
    user-select: none;
    -webkit-user-select: none;
  }

  header {
    flex: 0 0 auto;
    text-align: center;
    margin-bottom: 10px;
  }
  header h1 {
    margin: 0;
    font-size: 1.05rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  header .date {
    margin-top: 2px;
    font-size: 0.82rem;
    color: var(--muted);
    opacity: 0.8;
  }

  main {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
  }

  .slot {
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    border-radius: 18px;
    border: 1px solid var(--card-edge);
    background: var(--card);
    overflow: hidden;
    min-height: 0;
    position: relative;
  }
  .slot[data-key="ndb"]   { --accent: var(--accent-g); }
  .slot[data-key="lunch"] { --accent: var(--accent-lunch); }
  .slot[data-key="wrap"]  { --accent: var(--accent-wrap); }

  .slot .label {
    flex: 0 0 auto;
    padding: 10px 16px 0;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
  }

  /* Unrecorded: big tappable button fills the slot */
  .record-btn {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: clamp(1.4rem, 6vw, 2.1rem);
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: background 0.12s ease;
  }
  .record-btn:active { background: rgba(255,255,255,0.05); }
  .record-btn .tap-hint {
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--muted);
  }
  .record-btn .plus {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    color: var(--accent);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    line-height: 1;
  }

  /* Recorded: tap the time to manage it */
  .time-view {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    width: 100%;
    padding: 4px 12px;
    text-align: center;
  }
  .time-view:active { background: rgba(255,255,255,0.04); }
  .time-view .time {
    font-size: clamp(2rem, 11vw, 3.4rem);
    font-weight: 800;
    letter-spacing: 0.01em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .time-view .note {
    font-size: 0.9rem;
    color: var(--muted);
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-style: italic;
  }
  .time-view .edit-hint {
    font-size: 0.72rem;
    color: var(--muted);
    opacity: 0.65;
    letter-spacing: 0.05em;
  }

  /* Inline action sheet inside the slot (keeps page from scrolling) */
  .sheet {
    position: absolute;
    inset: 0;
    background: rgba(17,20,24,0.94);
    backdrop-filter: blur(2px);
    display: flex;
    flex-direction: column;
    padding: 12px 14px;
    gap: 10px;
    z-index: 5;
  }
  .sheet[hidden] { display: none; }
  .sheet .sheet-time {
    font-size: 0.9rem;
    color: var(--muted);
    text-align: center;
  }
  .sheet textarea {
    flex: 1 1 auto;
    resize: none;
    border-radius: 12px;
    border: 1px solid var(--card-edge);
    background: #0d1014;
    color: var(--text);
    padding: 10px 12px;
    font-size: 1rem;
    font-family: inherit;
    min-height: 0;
  }
  .sheet textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .sheet .time-edit {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .sheet .time-edit label {
    font-size: 0.82rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
  }
  .sheet input[type="time"] {
    background: #0d1014;
    color: var(--text);
    border: 1px solid var(--card-edge);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 1.15rem;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
    color-scheme: dark;
  }
  .sheet input[type="time"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .sheet-actions {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
  }
  .sheet-actions button {
    flex: 1 1 0;
    border: none;
    border-radius: 12px;
    padding: 12px 8px;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-done   { background: var(--accent); color: #111418; }
  .btn-undo   { background: #2a313a; color: var(--accent-wrap); }
  .btn-close  { background: #2a313a; color: var(--text); }
  .sheet-actions button:active { filter: brightness(0.9); }

  footer {
    flex: 0 0 auto;
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  footer .hint {
    text-align: center;
    font-size: 0.72rem;
    color: var(--muted);
    opacity: 0.7;
  }
  .footer-actions {
    display: flex;
    gap: 8px;
  }
  .fbtn {
    flex: 1 1 0;
    border: 1px solid var(--card-edge);
    border-radius: 12px;
    background: var(--card);
    color: var(--text);
    padding: 12px 8px;
    font-size: 0.86rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .fbtn:active { filter: brightness(1.2); }
  .fbtn-primary { background: var(--accent-g); color: #111418; border-color: var(--accent-g); }

  /* ---- Exhibit G timecard preview overlay ---- */
  .preview-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(8,10,13,0.92);
    backdrop-filter: blur(3px);
    display: flex;
    flex-direction: column;
    padding: calc(var(--safe-top) + 14px) 14px calc(var(--safe-bottom) + 14px);
  }
  .preview-overlay[hidden] { display: none; }
  .preview-scroll {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    justify-content: center;
  }
  /* The "paper" timecard */
  .timecard {
    width: 100%;
    max-width: 420px;
    align-self: flex-start;
    background: #fdfbf4;
    color: #16181c;
    border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    padding: 18px 18px 22px;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  .timecard .tc-badge {
    display: inline-block;
    font-size: 0.6rem;
    letter-spacing: 0.18em;
    font-weight: 700;
    color: #8a6d00;
    background: #fff2c2;
    border: 1px solid #e6c75a;
    border-radius: 4px;
    padding: 2px 6px;
    margin-bottom: 10px;
  }
  .timecard h2 {
    margin: 0;
    font-size: 1.15rem;
    letter-spacing: 0.06em;
    font-weight: 800;
  }
  .timecard .tc-sub {
    margin: 1px 0 12px;
    font-size: 0.74rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #6b6f76;
    font-weight: 700;
  }
  .timecard .tc-meta {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 10px;
    font-size: 0.82rem;
    margin-bottom: 14px;
  }
  .timecard .tc-meta dt { color: #6b6f76; font-weight: 700; }
  .timecard .tc-meta dd {
    margin: 0;
    border-bottom: 1px solid #cdd0d4;
    min-height: 1.1em;
  }
  .timecard table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.92rem;
  }
  .timecard th {
    text-align: left;
    font-size: 0.66rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6b6f76;
    border-bottom: 2px solid #16181c;
    padding: 0 0 5px;
  }
  .timecard th.tc-r, .timecard td.tc-r { text-align: right; }
  .timecard td {
    padding: 9px 0;
    border-bottom: 1px solid #d8dadd;
    vertical-align: top;
  }
  .timecard .tc-key { font-weight: 700; }
  .timecard .tc-keysub { display: block; font-size: 0.68rem; color: #6b6f76; font-weight: 400; }
  .timecard .tc-clock { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .timecard .tc-clock.tc-empty { color: #b9bcc1; font-weight: 400; }
  .timecard .tc-note { display: block; font-size: 0.7rem; color: #6b6f76; font-style: italic; margin-top: 2px; }
  .timecard .tc-foot {
    margin-top: 14px;
    font-size: 0.66rem;
    color: #8a8e95;
    line-height: 1.4;
  }
  .preview-bar {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .preview-bar button {
    flex: 1 1 0;
    border: none;
    border-radius: 12px;
    padding: 14px 8px;
    font-size: 0.9rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .preview-bar .btn-close-preview { background: #2a313a; color: var(--text); }
  .preview-bar .btn-send-preview { background: var(--accent-g); color: #111418; }
  .preview-bar button:active { filter: brightness(1.15); }

  /* Transient toast */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(var(--safe-bottom) + 84px);
    transform: translateX(-50%);
    background: #2a313a;
    color: var(--text);
    border: 1px solid var(--card-edge);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 0.84rem;
    font-weight: 600;
    z-index: 100;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <header>
    <h1>Exhibit G &middot; Time Logger</h1>
    <div class="date" id="dateLabel"></div>
  </header>

  <main id="main"><!-- slots injected by JS --></main>

  <footer>
    <div class="hint">Tap a time to adjust it, add a note, or undo &middot; Saved automatically</div>
    <div class="footer-actions">
      <button id="previewBtn" class="fbtn" type="button">Preview Exhibit&nbsp;G</button>
      <button id="sendBtn" class="fbtn fbtn-primary" type="button">Send to Rate&nbsp;Calc</button>
    </div>
  </footer>

  <!-- Exhibit G timecard preview (vertical) -->
  <div id="preview" class="preview-overlay" hidden>
    <div class="preview-scroll">
      <div class="timecard" id="timecard"><!-- built by JS --></div>
    </div>
    <div class="preview-bar">
      <button class="btn-close-preview" type="button">Close</button>
      <button class="btn-send-preview" type="button">Send to Rate Calculator</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var SLOTS = [
    { key: "ndb",   label: "NDB",   formal: "NDB",   sub: "Non-Deductible Breakfast" },
    { key: "lunch", label: "Lunch", formal: "Lunch", sub: "1st Meal" },
    { key: "wrap",  label: "Wrap",  formal: "Wrap",  sub: "Dismiss on set" }
  ];

  // Where "Send to Rate Calculator" hands off. The StuntListing rate
  // calculator is not built yet — point this at it when it exists.
  // The day's times are passed in the URL hash and also stashed in
  // localStorage under HANDOFF_KEY for a same-origin calculator to read.
  var RATE_CALC_URL = "/rate-calculator";
  var HANDOFF_KEY = "stuntlisting.rateCalc.handoff";

  // ---- Persistence (per calendar day) ----------------------------------
  var DATE_KEY = isoDate(new Date());        // e.g. 2026-06-01
  var STORE_KEY = "exhibitG.timelog." + DATE_KEY;

  function isoDate(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function load() {
    try {
      return JSON.parse(localStorage.getItem(STORE_KEY)) || {};
    } catch (e) {
      return {};
    }
  }

  function save(data) {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(data));
    } catch (e) {
      /* storage unavailable (e.g. private mode) — app still works in-session */
    }
  }

  var state = load(); // { g: {ts, note}, lunch: {...}, wrap: {...} }

  // ---- Time formatting --------------------------------------------------
  function formatTime(ts) {
    var d = new Date(ts);
    var h = d.getHours();
    var m = String(d.getMinutes()).padStart(2, "0");
    var ampm = h >= 12 ? "PM" : "AM";
    var h12 = h % 12;
    if (h12 === 0) h12 = 12;
    return h12 + ":" + m + " " + ampm;
  }

  // "HH:MM" (24h) value for <input type="time">, derived from a timestamp.
  function tsToInputValue(ts) {
    var d = new Date(ts);
    return String(d.getHours()).padStart(2, "0") + ":" +
           String(d.getMinutes()).padStart(2, "0");
  }

  // Apply a chosen "HH:MM" back onto an entry, keeping its original calendar day.
  function applyTime(ts, val) {
    var parts = (val || "").split(":");
    if (parts.length !== 2) return ts;
    var h = parseInt(parts[0], 10);
    var m = parseInt(parts[1], 10);
    if (isNaN(h) || isNaN(m)) return ts;
    var d = new Date(ts);
    d.setHours(h, m, 0, 0);
    return d.getTime();
  }

  // ---- Rendering --------------------------------------------------------
  var main = document.getElementById("main");

  function render() {
    main.innerHTML = "";
    SLOTS.forEach(function (slot) {
      main.appendChild(buildSlot(slot));
    });
  }

  function buildSlot(slot) {
    var entry = state[slot.key];

    var el = document.createElement("section");
    el.className = "slot";
    el.setAttribute("data-key", slot.key);

    var label = document.createElement("div");
    label.className = "label";
    label.textContent = slot.label;
    el.appendChild(label);

    if (!entry) {
      el.appendChild(buildRecordButton(slot));
    } else {
      el.appendChild(buildTimeView(slot, entry));
    }
    return el;
  }

  function buildRecordButton(slot) {
    var btn = document.createElement("button");
    btn.className = "record-btn";
    btn.type = "button";
    btn.innerHTML =
      '<span class="plus">+</span>' +
      '<span>Tap to log <span class="tap-hint">' + slot.label + "</span></span>";
    btn.addEventListener("click", function () {
      state[slot.key] = { ts: Date.now(), note: "" };
      save(state);
      render();
    });
    return btn;
  }

  function buildTimeView(slot, entry) {
    var view = document.createElement("div");
    view.className = "time-view";

    var time = document.createElement("div");
    time.className = "time";
    time.textContent = formatTime(entry.ts);
    view.appendChild(time);

    if (entry.note) {
      var note = document.createElement("div");
      note.className = "note";
      note.textContent = "“" + entry.note + "”";
      view.appendChild(note);
    }

    var hint = document.createElement("div");
    hint.className = "edit-hint";
    hint.textContent = "TAP TO ADJUST TIME / NOTE / UNDO";
    view.appendChild(hint);

    view.addEventListener("click", function () {
      openSheet(slot, entry);
    });
    return view;
  }

  // ---- Inline action sheet (no page scroll) -----------------------------
  function openSheet(slot, entry) {
    var slotEl = main.querySelector('.slot[data-key="' + slot.key + '"]');
    if (!slotEl || slotEl.querySelector(".sheet")) return;

    var sheet = document.createElement("div");
    sheet.className = "sheet";

    var when = document.createElement("div");
    when.className = "sheet-time";
    when.textContent = "Edit " + slot.label + " time";
    sheet.appendChild(when);

    var timeEdit = document.createElement("div");
    timeEdit.className = "time-edit";
    var timeLabel = document.createElement("label");
    timeLabel.textContent = "Time";
    var timeInput = document.createElement("input");
    timeInput.type = "time";
    timeInput.value = tsToInputValue(entry.ts);
    timeLabel.setAttribute("for", "time-" + slot.key);
    timeInput.id = "time-" + slot.key;
    timeEdit.appendChild(timeLabel);
    timeEdit.appendChild(timeInput);
    sheet.appendChild(timeEdit);

    var ta = document.createElement("textarea");
    ta.placeholder = "Add a note (optional)…";
    ta.value = entry.note || "";
    sheet.appendChild(ta);

    var actions = document.createElement("div");
    actions.className = "sheet-actions";

    var undo = document.createElement("button");
    undo.type = "button";
    undo.className = "btn-undo";
    undo.textContent = "Undo time";
    undo.addEventListener("click", function () {
      delete state[slot.key];
      save(state);
      render();
    });

    var close = document.createElement("button");
    close.type = "button";
    close.className = "btn-close";
    close.textContent = "Cancel";
    close.addEventListener("click", function () {
      render();
    });

    var done = document.createElement("button");
    done.type = "button";
    done.className = "btn-done";
    done.textContent = "Save";
    done.addEventListener("click", function () {
      if (timeInput.value) state[slot.key].ts = applyTime(entry.ts, timeInput.value);
      state[slot.key].note = ta.value.trim();
      save(state);
      render();
    });

    actions.appendChild(undo);
    actions.appendChild(close);
    actions.appendChild(done);
    sheet.appendChild(actions);

    slotEl.appendChild(sheet);
    ta.focus();
  }

  // ---- Rate calculator hand-off -----------------------------------------
  function loggedCount() {
    return SLOTS.filter(function (s) { return state[s.key]; }).length;
  }

  // Package the day's times for the StuntListing rate calculator.
  function buildPayload() {
    var times = {};
    SLOTS.forEach(function (s) {
      var e = state[s.key];
      times[s.key] = e ? {
        iso: new Date(e.ts).toISOString(),
        hhmm: tsToInputValue(e.ts),
        clock: formatTime(e.ts),
        note: e.note || ""
      } : null;
    });
    return { source: "stuntlisting-exhibitG-timelogger", version: 1, date: DATE_KEY, times: times };
  }

  function sendToRateCalc() {
    if (loggedCount() === 0) {
      toast("Log a time before sending");
      return;
    }
    var payload = buildPayload();
    try { localStorage.setItem(HANDOFF_KEY, JSON.stringify(payload)); } catch (e) {}
    toast("Sending " + loggedCount() + " time" + (loggedCount() === 1 ? "" : "s") + " to Rate Calculator…");
    var url = RATE_CALC_URL + "#handoff=" + encodeURIComponent(JSON.stringify(payload));
    setTimeout(function () { window.location.href = url; }, 450);
  }

  // ---- Toast ------------------------------------------------------------
  var toastEl = document.getElementById("toast");
  var toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1900);
  }

  // ---- Exhibit G timecard preview ---------------------------------------
  var previewEl = document.getElementById("preview");
  var timecardEl = document.getElementById("timecard");

  function metaRow(dl, label, value) {
    var dt = document.createElement("dt"); dt.textContent = label;
    var dd = document.createElement("dd"); dd.textContent = value || "";
    dl.appendChild(dt); dl.appendChild(dd);
  }

  function buildTimecard() {
    timecardEl.innerHTML = "";

    var badge = document.createElement("span");
    badge.className = "tc-badge";
    badge.textContent = "PREVIEW · MOCK-UP";
    timecardEl.appendChild(badge);

    var h2 = document.createElement("h2");
    h2.textContent = "EXHIBIT G";
    timecardEl.appendChild(h2);

    var sub = document.createElement("div");
    sub.className = "tc-sub";
    sub.textContent = "Daily Time Report";
    timecardEl.appendChild(sub);

    var dl = document.createElement("dl");
    dl.className = "tc-meta";
    metaRow(dl, "Production", "");
    metaRow(dl, "Performer", "");
    metaRow(dl, "Date", new Date(DATE_KEY + "T00:00:00").toLocaleDateString(undefined, {
      weekday: "short", month: "short", day: "numeric", year: "numeric"
    }));
    timecardEl.appendChild(dl);

    var table = document.createElement("table");
    var thead = document.createElement("thead");
    thead.innerHTML =
      "<tr><th>Key Time</th><th class='tc-r'>Clock</th></tr>";
    table.appendChild(thead);

    var tbody = document.createElement("tbody");
    SLOTS.forEach(function (s) {
      var e = state[s.key];
      var tr = document.createElement("tr");

      var tdKey = document.createElement("td");
      var key = document.createElement("span");
      key.className = "tc-key";
      key.textContent = s.formal;
      tdKey.appendChild(key);
      var ks = document.createElement("span");
      ks.className = "tc-keysub";
      ks.textContent = s.sub;
      tdKey.appendChild(ks);
      if (e && e.note) {
        var n = document.createElement("span");
        n.className = "tc-note";
        n.textContent = "“" + e.note + "”";
        tdKey.appendChild(n);
      }

      var tdClock = document.createElement("td");
      tdClock.className = "tc-r";
      var clock = document.createElement("span");
      clock.className = "tc-clock" + (e ? "" : " tc-empty");
      clock.textContent = e ? formatTime(e.ts) : "— : —";
      tdClock.appendChild(clock);

      tr.appendChild(tdKey);
      tr.appendChild(tdClock);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    timecardEl.appendChild(table);

    var foot = document.createElement("div");
    foot.className = "tc-foot";
    foot.textContent = "Preview only — generated from your logged key times as a cross-check " +
      "against the official Exhibit G time card. Not a substitute for the production's form.";
    timecardEl.appendChild(foot);
  }

  function openPreview() {
    buildTimecard();
    previewEl.hidden = false;
  }
  function closePreview() {
    previewEl.hidden = true;
  }

  // ---- Init -------------------------------------------------------------
  document.getElementById("dateLabel").textContent =
    new Date().toLocaleDateString(undefined, {
      weekday: "long", month: "long", day: "numeric", year: "numeric"
    });

  document.getElementById("previewBtn").addEventListener("click", openPreview);
  document.getElementById("sendBtn").addEventListener("click", sendToRateCalc);
  previewEl.querySelector(".btn-close-preview").addEventListener("click", closePreview);
  previewEl.querySelector(".btn-send-preview").addEventListener("click", sendToRateCalc);

  render();
})();
</script>
</body>
</html>
